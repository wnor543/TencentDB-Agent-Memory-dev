name: Build Docker Images

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag 或版本号，例如 v1.2.3'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_TAG}"
          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "master" ]]; then
            echo "tag must be provided and must be a valid image tag" >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid Docker tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MemoryCore
            image: memory-core
            context: ./MemoryCore
            file: ./MemoryCore/Dockerfile
          - name: MemoryKnowledge
            image: memory-knowledge
            context: ./MemoryKnowledge
            file: ./MemoryKnowledge/Dockerfile
          - name: MemoryPanel
            image: memory-panel
            context: ./MemoryPanel
            file: ./.github/workflows/Dockerfile.memory-panel
          - name: MemoryProxy
            image: memory-proxy
            context: ./MemoryProxy
            file: ./MemoryProxy/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}