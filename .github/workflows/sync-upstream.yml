name: Sync Upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: '上游仓库，格式为 owner/repository'
        required: true
        default: TencentCloud/TencentDB-Agent-Memory
        type: string
      upstream_branch:
        description: '上游分支'
        required: true
        default: feat/server_team
        type: string
      target_branch:
        description: '本仓库接收同步的分支'
        required: true
        default: feat/server_team
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream changes
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'TencentCloud/TencentDB-Agent-Memory' }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'feat/server_team' }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'feat/server_team' }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'feat/server_team' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}:${UPSTREAM_BRANCH}-upstream"

      - name: Merge upstream branch
        run: |
          git checkout "${TARGET_BRANCH}"
          git merge --no-edit "${UPSTREAM_BRANCH}-upstream"

      - name: Push synchronized branch
        run: git push origin "HEAD:${TARGET_BRANCH}"